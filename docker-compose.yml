version: '3.8'

services:
  mongo:
    image: mongo:7.0-alpine
    container_name: journal-mongo
    environment:
      MONGO_INITDB_DATABASE: journaldb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - journal-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: journal-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - journal-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: journal-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_USERNAME:-admin}' password='${KAFKA_PASSWORD:-admin}';
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_PLAINTEXT
    ports:
      - "9092:9092"
    networks:
      - journal-network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: journal-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - journal-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal-app
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongo:27017/journaldb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      KAFKA_SERVERS: kafka:9092
      KAFKA_USERNAME: ${KAFKA_USERNAME:-admin}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JAVA_EMAIL: ${JAVA_EMAIL}
      JAVA_EMAIL_PASSWORD: ${JAVA_EMAIL_PASSWORD}
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: production
    ports:
      - "8080:8080"
    networks:
      - journal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8080/journal/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:

networks:
  journal-network:
    driver: bridge
