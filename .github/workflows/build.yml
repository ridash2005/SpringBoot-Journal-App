name: Build and Deploy
on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
      
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      - name: Verify Maven installation
        run: mvn --version
      
      - name: Build and Compile (No Tests)
        run: mvn clean compile -DskipTests
        # Tests are skipped in CI because they require MongoDB, Redis, and Kafka services
        # To run tests locally: mvn test (requires docker-compose up)
      
      - name: Package Application
        run: mvn package -DskipTests
      
      - name: Verify JAR exists
        run: |
          if [ -f target/journalApp-1.0.0.jar ]; then
            echo "✓ JAR file built successfully"
            ls -lh target/journalApp-1.0.0.jar
          else
            echo "✗ JAR file not found"
            exit 1
          fi
      
      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=rickarya_journalapp
        if: env.SONAR_TOKEN != ''
  
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: journalapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar
      
      - name: Test Docker Image
        run: |
          docker load --input /tmp/image.tar
          docker run --rm journalapp:${{ github.sha }} java -version
          echo "✓ Docker image built and verified successfully"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify deployment configuration
        run: |
          if [ -f docker-compose.yml ] && [ -f Dockerfile ]; then
            echo "✓ Docker composition files verified"
          else
            echo "✗ Docker files missing"
            exit 1
          fi
      
      - name: Log deployment status
        run: |
          echo "Deployment pipeline completed successfully"
          echo "Image tag: ${{ github.sha }}"
          echo "Commit: $(git rev-parse --short HEAD)"

